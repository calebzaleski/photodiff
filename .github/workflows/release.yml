name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    # Scoped to this job rather than the whole workflow.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # bundle.sh reads the tag for the version string

      - name: Show toolchain
        run: swift --version

      - name: Test
        run: swift test

      - name: Build app bundle
        run: ./bundle.sh release

      - name: Zip
        run: ditto -c -k --keepParent build/PhotoDiff.app build/PhotoDiff.app.zip

      - name: Attach to release
        # Pinned to a commit, not a tag: a third-party action holding
        # contents:write could otherwise change under us if the tag moved.
        uses: softprops/action-gh-release@28ab305d0ffa26d60ec4bd614126329e26c7a0ec # v3.0.4
        with:
          files: build/PhotoDiff.app.zip
          body: |
            Ad-hoc signed, not notarized. On first launch, right-click the app and
            choose Open rather than double-clicking.

            Libraries are only ever read. See the README for how that is enforced.
